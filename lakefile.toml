name = "PvsNP"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PvsNP"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# This is not mathlib, so the copyright-header format check does not apply.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "PvsNP"
